<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420" role="img" aria-labelledby="title desc">
<title id="title">Multiple Streams Tool</title><desc id="desc">Four stream windows. Stream one is audible; the others are muted. Use F7 through F10 to select a stream.</desc>
<rect width="1200" height="420" rx="20" fill="#101722"/>
<g font-family="Segoe UI,Arial,sans-serif"><text x="52" y="61" font-size="13" letter-spacing="3" fill="#72e3c0">MULTIPLE STREAMS TOOL</text>
<text x="52" y="117" font-size="42" font-weight="700" fill="#e8edf5">Keep watching. Choose what you hear.</text>
<text x="52" y="155" font-size="19" fill="#b4c1d3">Two to four streams. One audio source. Windows + your browser.</text>
<g transform="translate(52 199)"><rect width="257" height="164" rx="12" fill="#18372f" stroke="#72e3c0" stroke-width="2"/><rect x="18" y="18" width="43" height="29" rx="5" fill="#72e3c0"/><text x="28" y="39" font-size="16" font-weight="700" fill="#10281f">F7</text><text x="18" y="92" fill="#e8edf5" font-size="25" font-weight="600">Stream 1</text><circle cx="25" cy="126" r="5" fill="#72e3c0"/><text x="41" y="132" fill="#72e3c0" font-size="16">Sound on</text></g>
<g transform="translate(332 199)"><rect width="257" height="164" rx="12" fill="#182333" stroke="#34445a"/><text x="18" y="40" fill="#b4c1d3" font-size="16" font-weight="700">F8</text><text x="18" y="92" fill="#e8edf5" font-size="25" font-weight="600">Stream 2</text><text x="18" y="132" fill="#b4c1d3" font-size="16">Muted</text></g>
<g transform="translate(612 199)"><rect width="257" height="164" rx="12" fill="#182333" stroke="#34445a"/><text x="18" y="40" fill="#b4c1d3" font-size="16" font-weight="700">F9</text><text x="18" y="92" fill="#e8edf5" font-size="25" font-weight="600">Stream 3</text><text x="18" y="132" fill="#b4c1d3" font-size="16">Muted</text></g>
<g transform="translate(892 199)"><rect width="257" height="164" rx="12" fill="#182333" stroke="#34445a"/><text x="18" y="40" fill="#b4c1d3" font-size="16" font-weight="700">F10</text><text x="18" y="92" fill="#e8edf5" font-size="25" font-weight="600">Stream 4</text><text x="18" y="132" fill="#b4c1d3" font-size="16">Muted</text></g></g></svg>
